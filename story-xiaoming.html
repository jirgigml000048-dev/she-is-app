<script>
(function() {
  const audio = document.getElementById('bgAudio');
  if (!audio) return;
  audio.volume = 0.35;
  audio.muted = true;
  audio.play().catch(function(){});
  let unmuted = false;
  function unmute() {
    if (!unmuted) {
      audio.muted = false;
      unmuted = true;
    }
    document.removeEventListener('click', unmute);
    document.removeEventListener('touchstart', unmute);
  }
  document.addEventListener('click', unmute);
  document.addEventListener('touchstart', unmute);
})();
</script>

<script>
  (async () => {
    if (typeof getUser !== 'function') return;
    const user = await getUser();
    const loginBtn  = document.getElementById('loginEntryBtn');
    const avatarBtn = document.getElementById('userAvatarBtn');
    if (!loginBtn || !avatarBtn) return;
    if (user) {
      const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email?.split('@')[0] || '我';
      avatarBtn.textContent = name.charAt(0).toUpperCase();
      avatarBtn.classList.remove('hidden');
    } else {
      loginBtn.classList.remove('hidden');
    }
  })();
</script>

<script>
(function() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.story-section').forEach(el => obs.observe(el));
})();
</script>
