<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="assets/theme-init.js"></script>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>登录 | 女也 She Is</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.loli.net/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    font-family: 'Noto Serif SC', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  .serif-display { font-family: 'Noto Serif SC', serif; }
  .asymmetric-gradient {
    background: radial-gradient(circle at top right, rgba(74,48,115,0.05) 0%, transparent 70%);
  }
</style>
<link rel="stylesheet" href="css/font-override.css">
</head>
<body class="bg-surface selection:bg-primary-fixed selection:text-primary min-h-screen flex flex-col items-center justify-between overflow-x-hidden">

<!-- Header -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-8 h-24 bg-transparent">
  <div class="serif-display text-2xl tracking-[0.2em] font-bold text-primary italic">女也 She Is</div>
  <a href="javascript:history.back()" class="p-2 text-primary/60 hover:text-primary transition-colors">
    <span class="material-symbols-outlined">close</span>
  </a>
</header>

<main class="flex-1 w-full max-w-md px-8 pt-32 pb-12 asymmetric-gradient">

  <!-- Hero -->
  <section class="mb-16">
    <h1 class="serif-display text-4xl leading-tight mb-4 text-primary font-bold">
      Welcome<br>
      <span class="text-secondary/80">与自己重逢</span>
    </h1>
    <p class="font-body text-on-surface-variant/70 text-sm tracking-wide leading-relaxed">
      Your digital sanctuary for self-reflection.
    </p>
  </section>

  <!-- SMS Form -->
  <div id="smsForm" class="space-y-8">
    <div class="space-y-6">
      <!-- Phone -->
      <div class="relative group">
        <label class="block font-label text-[10px] uppercase tracking-widest text-primary/60 mb-2 ml-1">
          手机号码 / Phone Number
        </label>
        <div class="flex items-center bg-surface-container-low rounded-lg transition-all duration-300 group-focus-within:bg-surface-container-high px-4 py-1">
          <span class="text-sm font-medium text-primary/80 pr-4 border-r border-outline-variant/30">+86</span>
          <input id="phoneInput" class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant/60 font-body text-base py-3 pl-4" placeholder="输入您的手机号" type="tel" maxlength="11" inputmode="numeric">
        </div>
      </div>
      <!-- OTP -->
      <div id="otpRow" class="relative group hidden">
        <label class="block font-label text-[10px] uppercase tracking-widest text-primary/60 mb-2 ml-1">
          验证码 / Verification Code
        </label>
        <div class="flex items-center bg-surface-container-low rounded-lg transition-all duration-300 group-focus-within:bg-surface-container-high px-4 py-1">
          <input id="otpInput" class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant/60 font-body text-base py-3" placeholder="6位数字" type="text" maxlength="6" inputmode="numeric">
          <button id="resendBtn" class="text-primary font-medium text-xs tracking-tight hover:opacity-70 transition-opacity pl-4 whitespace-nowrap hidden" type="button">重新发送</button>
        </div>
      </div>
    </div>

    <!-- Error -->
    <p id="smsError" class="text-sm text-error hidden"></p>

    <!-- CTA -->
    <button id="smsBtn" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary py-4 rounded-lg font-body font-semibold tracking-widest shadow-xl shadow-primary/10 hover:shadow-primary/20 transition-all active:scale-[0.98]" type="button">
      获取验证码
    </button>
  </div>

  <!-- Divider -->
  <div class="relative my-12 flex items-center justify-center">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-outline-variant/20"></div>
    </div>
    <span class="relative bg-surface px-4 text-[10px] uppercase tracking-[0.25em] font-label text-outline-variant">
      其他方式 / Alternatives
    </span>
  </div>

  <!-- Secondary options -->
  <div class="grid grid-cols-2 gap-4">
    <button id="emailBtn" class="flex items-center justify-center space-x-3 py-3 px-4 rounded-lg bg-surface-container-lowest border border-outline-variant/10 hover:bg-surface-container transition-colors" type="button">
      <span class="material-symbols-outlined text-xl text-primary/70">alternate_email</span>
      <span class="font-label text-xs font-semibold tracking-tight text-on-surface-variant">邮箱登录</span>
    </button>
    <button id="googleBtn" class="flex items-center justify-center space-x-3 py-3 px-4 rounded-lg bg-surface-container-lowest border border-outline-variant/10 hover:bg-surface-container transition-colors" type="button">
      <span class="material-symbols-outlined text-xl text-primary/70">account_circle</span>
      <span class="font-label text-xs font-semibold tracking-tight text-on-surface-variant">Google</span>
    </button>
  </div>

  <!-- Email modal (inline, hidden by default) -->
  <div id="emailForm" class="hidden mt-8 space-y-6">
    <div class="relative group">
      <label class="block font-label text-[10px] uppercase tracking-widest text-primary/60 mb-2 ml-1">
        邮箱地址 / Email
      </label>
      <div class="flex items-center bg-surface-container-low rounded-lg transition-all duration-300 group-focus-within:bg-surface-container-high px-4 py-1">
        <input id="emailInput" class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline-variant/60 font-body text-base py-3" placeholder="your@email.com" type="email">
      </div>
    </div>
    <p id="emailError" class="text-sm text-error hidden"></p>
    <button id="emailSendBtn" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary py-4 rounded-lg font-body font-semibold tracking-widest shadow-xl transition-all active:scale-[0.98]" type="button">
      发送 Magic Link
    </button>
    <p id="emailSuccess" class="text-sm text-center text-on-surface-variant/70 hidden">✓ 链接已发送，请查收邮箱</p>
  </div>

</main>

<!-- Footer -->
<footer class="w-full max-w-md px-8 pb-10 text-center">
  <p class="font-label text-[10px] text-outline-variant/80 leading-relaxed">
    By continuing, you agree to our
    <a class="text-primary-container font-semibold hover:underline" href="#">Terms of Service</a>
    &nbsp;and&nbsp;
    <a class="text-primary-container font-semibold hover:underline" href="#">Privacy Policy</a>.
  </p>
</footer>

<!-- BG decor -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed top-1/2 -right-12 w-48 h-48 bg-secondary/5 rounded-full blur-[60px] pointer-events-none"></div>

<script>
  const SUPABASE_URL = 'https://xagmrtiajoyznquzehqd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_VrywoMuwI8TJoZMIrhT-5A_A0I1yltP';
  try {
    const { createClient } = window.supabase || supabase;
    window.sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    console.log('[login] window.sb initialized:', !!window.sb?.auth);
  } catch(e) {
    console.error('[login] supabase init failed:', e);
  }

  function getRedirectTarget() {
    const params = new URLSearchParams(window.location.search);
    return params.get('next') || 'index.html';
  }

  const EDGE_BASE = 'https://xagmrtiajoyznquzehqd.supabase.co/functions/v1';
  async function getEdgeBase() { return EDGE_BASE; }

  let smsSent = false;
  let countdown = 0;
  let countdownTimer = null;

  const phoneInput   = document.getElementById('phoneInput');
  const otpRow       = document.getElementById('otpRow');
  const otpInput     = document.getElementById('otpInput');
  const smsBtn       = document.getElementById('smsBtn');
  const resendBtn    = document.getElementById('resendBtn');
  const smsError     = document.getElementById('smsError');
  const emailBtn     = document.getElementById('emailBtn');
  const googleBtn    = document.getElementById('googleBtn');
  const emailForm    = document.getElementById('emailForm');
  const emailInput   = document.getElementById('emailInput');
  const emailSendBtn = document.getElementById('emailSendBtn');
  const emailError   = document.getElementById('emailError');
  const emailSuccess = document.getElementById('emailSuccess');

  function showError(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }
  function hideError(el) { el.classList.add('hidden'); }

  function startCountdown() {
    countdown = 60;
    resendBtn.classList.remove('hidden');
    resendBtn.disabled = true;
    resendBtn.textContent = `${countdown}s 后重发`;
    countdownTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(countdownTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = '重新发送';
      } else {
        resendBtn.textContent = `${countdown}s 后重发`;
      }
    }, 1000);
  }

  async function sendSMSOtp() {
    const phone = phoneInput.value.trim().replace(/\D/g, '');
    if (!/^\d{11}$/.test(phone)) {
      showError(smsError, '请输入正确的11位手机号'); return;
    }
    hideError(smsError);
    smsBtn.disabled = true;
    smsBtn.textContent = '发送中…';

    const base = await getEdgeBase();
    if (!base) { showError(smsError, '初始化失败，请刷新重试'); smsBtn.disabled = false; smsBtn.textContent = '获取验证码'; return; }

    const res = await fetch(`${base}/send-sms`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ phone })
    });
    const data = await res.json();
    smsBtn.disabled = false;
    if (!res.ok || data.error) {
      showError(smsError, data.error || '发送失败，请稍后重试');
      smsBtn.textContent = '获取验证码';
      return;
    }
    smsSent = true;
    otpRow.classList.remove('hidden');
    otpInput.focus();
    smsBtn.textContent = '进入空间 / ENTER SPACE';
    startCountdown();
  }

  async function verifySMSOtp() {
    const phone = phoneInput.value.trim().replace(/\D/g, '');
    const code  = otpInput.value.trim();
    if (!code || code.length !== 6) {
      showError(smsError, '请输入6位验证码'); return;
    }
    hideError(smsError);
    smsBtn.disabled = true;
    smsBtn.textContent = '验证中…';

    const base = await getEdgeBase();
    if (!base) { showError(smsError, '初始化失败，请刷新重试'); smsBtn.disabled = false; smsBtn.textContent = '进入空间 / ENTER SPACE'; return; }

    const res = await fetch(`${base}/verify-sms`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ phone, code })
    });
    const data = await res.json();
    smsBtn.disabled = false;
    if (!res.ok || data.error) {
      showError(smsError, data.error || '验证码错误，请重试');
      smsBtn.textContent = '进入空间 / ENTER SPACE';
      return;
    }
    // 写入 session（直接写 localStorage，绕过 sb client 兼容性问题）
    if (data.session) {
      const storageKey = 'sb-xagmrtiajoyznquzehqd-auth-token';
      localStorage.setItem(storageKey, JSON.stringify(data.session));
    }
    window.location.href = getRedirectTarget();
  }

  smsBtn.addEventListener('click', () => {
    if (!smsSent) sendSMSOtp();
    else verifySMSOtp();
  });
  resendBtn.addEventListener('click', () => {
    smsSent = false;
    clearInterval(countdownTimer);
    sendSMSOtp();
  });

  // ── Email magic link ──
  emailBtn.addEventListener('click', () => {
    emailForm.classList.toggle('hidden');
    if (!emailForm.classList.contains('hidden')) emailInput.focus();
  });
  emailSendBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError(emailError, '请输入正确的邮箱地址'); return;
    }
    hideError(emailError);
    emailSendBtn.disabled = true;
    emailSendBtn.textContent = '发送中…';
    const { error } = await window.sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/' + getRedirectTarget() }
    });
    emailSendBtn.disabled = false;
    emailSendBtn.textContent = '发送 Magic Link';
    if (error) { showError(emailError, error.message || '发送失败'); return; }
    emailSuccess.classList.remove('hidden');
    emailSendBtn.classList.add('hidden');
  });

  // ── Google OAuth ──
  googleBtn.addEventListener('click', async () => {
    await window.sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/' + getRedirectTarget() }
    });
  });

  // ── Init ──
  async function init() {
    let tries = 0;
    while (!window.sb && tries < 30) {
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if (!window.sb) return;
    const { data: { user } } = await window.sb.auth.getUser();
    if (user) window.location.href = getRedirectTarget();
  }
  init();
</script>

<!-- load auth.js after inline script so sb is available -->
<script src="assets/auth.js"></script>
</body>
</html>
