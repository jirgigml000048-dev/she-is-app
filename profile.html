<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="assets/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的档案 · She Is</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #f5f0eb;
      color: #1E1628;
      font-family: 'Noto Serif SC', Georgia, serif;
      min-height: 100vh;
      padding-bottom: 100px;
    }
    .dark body {
      background: #1a1520;
      color: #e8e0f0;
    }
    .accent { color: #4A3073; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(74,48,115,0.1);
    }
    .dark .card {
      background: #231d2e;
      border-color: rgba(180,155,225,0.15);
    }
    .card-title {
      font-size: 11px;
      font-family: 'Noto Sans SC', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4A3073;
      opacity: 0.7;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .dark .card-title { color: #b49be1; opacity: 0.8; }
    .assessment-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(74,48,115,0.08);
    }
    .assessment-item:last-child { border-bottom: none; }
    .dark .assessment-item { border-color: rgba(180,155,225,0.1); }
    .assessment-name {
      font-size: 14px;
      font-weight: 500;
      color: #1E1628;
      margin-bottom: 3px;
    }
    .dark .assessment-name { color: #e8e0f0; }
    .assessment-result {
      font-size: 13px;
      color: #4A3073;
      font-style: italic;
    }
    .dark .assessment-result { color: #c5adf0; }
    .assessment-time {
      font-size: 11px;
      font-family: 'Noto Sans SC', sans-serif;
      color: rgba(30,22,40,0.4);
      margin-top: 3px;
    }
    .dark .assessment-time { color: rgba(232,224,240,0.4); }
    .letter-item {
      padding: 12px 0;
      border-bottom: 1px solid rgba(74,48,115,0.08);
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .letter-item:last-child { border-bottom: none; }
    .dark .letter-item { border-color: rgba(180,155,225,0.1); }
    .letter-title {
      font-size: 14px;
      font-weight: 500;
      color: #1E1628;
      margin-bottom: 3px;
    }
    .dark .letter-title { color: #e8e0f0; }
    .letter-preview {
      font-size: 12px;
      color: rgba(30,22,40,0.5);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      font-family: 'Noto Sans SC', sans-serif;
    }
    .dark .letter-preview { color: rgba(232,224,240,0.45); }
    .letter-date {
      font-size: 11px;
      font-family: 'Noto Sans SC', sans-serif;
      color: rgba(30,22,40,0.4);
      margin-top: 3px;
    }
    .dark .letter-date { color: rgba(232,224,240,0.4); }
    .mood-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(74,48,115,0.08);
    }
    .mood-item:last-child { border-bottom: none; }
    .dark .mood-item { border-color: rgba(180,155,225,0.1); }
    .mood-emoji { font-size: 20px; line-height: 1; flex-shrink: 0; }
    .mood-label { font-size: 14px; color: #1E1628; }
    .dark .mood-label { color: #e8e0f0; }
    .mood-date {
      font-size: 11px;
      font-family: 'Noto Sans SC', sans-serif;
      color: rgba(30,22,40,0.4);
      margin-left: auto;
    }
    .dark .mood-date { color: rgba(232,224,240,0.4); }
    .empty-tip {
      font-size: 13px;
      color: rgba(30,22,40,0.4);
      font-style: italic;
      padding: 8px 0;
      font-family: 'Noto Sans SC', sans-serif;
    }
    .dark .empty-tip { color: rgba(232,224,240,0.35); }
    .user-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg,#4a3073,#9c3c62);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; color: white;
      flex-shrink: 0;
    }
    .login-banner {
      background: rgba(74,48,115,0.07);
      border: 1px dashed rgba(74,48,115,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .dark .login-banner {
      background: rgba(180,155,225,0.07);
      border-color: rgba(180,155,225,0.2);
    }
    .login-btn {
      background: #4A3073;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-family: 'Noto Sans SC', sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="max-w-lg mx-auto px-4 pt-6">

    <!-- User header -->
    <div id="userHeader" class="flex items-center gap-3 mb-6 hidden">
      <div class="user-avatar" id="avatarCircle"></div>
      <div>
        <div id="userName" class="text-base font-medium" style="color:#1E1628;"></div>
        <div id="userEmail" class="text-xs font-sans" style="color:rgba(30,22,40,0.5);"></div>
      </div>
    </div>
    <div id="loginBanner" class="login-banner hidden">
      <span class="text-sm" style="color:rgba(30,22,40,0.6);font-family:'Noto Sans SC',sans-serif;">登录后查看完整档案</span>
      <a href="login.html" class="login-btn">登录</a>
    </div>
    <div id="guestNote" class="mb-4 hidden">
      <p class="text-xs font-sans" style="color:rgba(30,22,40,0.45);">以访客身份浏览 · 本地数据仅存在此设备</p>
    </div>

    <!-- Section 1: Assessment results -->
    <div class="card">
      <div class="card-title">我的测评结果</div>
      <div id="assessmentList"><p class="empty-tip">暂无测评记录</p></div>
    </div>

    <!-- Section 2: My letters -->
    <div class="card">
      <div class="card-title">我的来信</div>
      <div id="letterList"><p class="empty-tip">暂无来信</p></div>
      <a href="mailbox.html" class="block text-center mt-3 text-xs font-sans" style="color:#4A3073;opacity:0.7;">查看全部来信 →</a>
    </div>

    <!-- Section 3: Mood log -->
    <div class="card">
      <div class="card-title">心情打卡</div>
      <div id="moodList"><p class="empty-tip">暂无心情记录</p></div>
    </div>

  </div>

    <div id="app-nav"></div>
  <div style="height:80px;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/profile-utils.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/header.js"></script>
  <script>
  // ── Assessment module names ──────────────────────────────────────────
  const ASSESSMENT_NAMES = {
    'cognitive-functions': '认知功能偏好',
    'cognitive-48': '48题认知测评',
    'hsp': '高敏感人格 HSP',
    'erq': '情绪调节策略 ERQ',
    'ecr': '依恋风格 ECR',
    'fmps': '完美主义倾向 FMPS',
    'boundary-sense': '边界感测评',
    'relationship-role': '关系角色测评',
    'today-mood': '今日心情快测',
  };

  // ── Mood emoji/label map ─────────────────────────────────────────────
  const MOOD_MAP = {
    calm:        { emoji: '🌊', label: '平静' },
    anxious:     { emoji: '⚡', label: '焦虑' },
    tired:       { emoji: '🌙', label: '疲惫' },
    alive:       { emoji: '🌱', label: '有活力' },
    numb:        { emoji: '🪨', label: '麻木' },
    sad:         { emoji: '😔', label: '悲伤' },
    grateful:    { emoji: '✨', label: '感恩' },
    overwhelmed: { emoji: '🌀', label: '压力大' },
  };

  // ── Helpers ──────────────────────────────────────────────────────────
  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  }

  // ── Render assessments ───────────────────────────────────────────────
  const ASSESSMENT_URLS = {
    'cognitive-functions': 'test-cognitive.html',
    'cognitive-48': 'test-cognitive-48.html',
    'hsp': 'test-hsp.html',
    'erq': 'test-erq.html',
    'ecr': 'test-ecr.html',
    'fmps': 'test-fmps.html',
    'boundary-sense': 'test-boundary.html',
    'relationship-role': 'test-relationship.html',
    'today-mood': 'index.html',
  };

  function renderAssessments() {
    const el = document.getElementById('assessmentList');
    if (!window.SheProfileStore) return;

    // Gather all history entries across all modules
    const allEntries = [];
    const keys = Object.keys(ASSESSMENT_NAMES);
    keys.forEach(moduleId => {
      // Try history first
      try {
        const histKey = 'she_result_history_' + moduleId;
        const hist = JSON.parse(localStorage.getItem(histKey) || '[]');
        if (hist.length > 0) {
          hist.forEach(h => allEntries.push({ ...h, moduleId }));
          return;
        }
      } catch(e) {}
      // Fallback: single result
      const r = window.SheProfileStore.getResult(moduleId);
      if (r) allEntries.push(r);
    });

    if (allEntries.length === 0) {
      el.innerHTML = '<p class="empty-tip">暂无测评记录，去完成一项测评吧</p>';
      return;
    }

    // Sort by completedAt desc
    allEntries.sort((a, b) => new Date(b.completedAt||0) - new Date(a.completedAt||0));

    el.innerHTML = allEntries.map(r => {
      const name = ASSESSMENT_NAMES[r.moduleId] || r.moduleName || r.moduleId;
      const summary = r.summary || r.topDimension || '';
      const date = fmtDate(r.completedAt);
      const url = ASSESSMENT_URLS[r.moduleId] || 'assessment.html';
      return `<a href="${url}" class="assessment-item" style="text-decoration:none;display:block;cursor:pointer;">
        <div class="assessment-name">${name}</div>
        ${summary ? `<div class="assessment-result">${summary}</div>` : ''}
        ${date ? `<div class="assessment-time">${date}</div>` : ''}
      </a>`;
    }).join('');
  }

  // ── Render letters ───────────────────────────────────────────────────
  function renderLetters() {
    const el = document.getElementById('letterList');
    let letters = [];
    try {
      letters = JSON.parse(localStorage.getItem('sheIs_letters') || '[]');
    } catch(e) {}
    if (!letters.length) {
      el.innerHTML = '<p class="empty-tip">还没有写过来信，去写一封吧</p>';
      return;
    }
    const show = letters.slice(0, 5);
    el.innerHTML = show.map(l => {
      const title = l.subject || '无题';
      const preview = (l.body || '').replace(/\n/g,' ').slice(0, 60);
      const date = fmtDate(l.timestamp || l.date);
      return `<a href="mailbox.html" class="letter-item">
        <div class="letter-title">${title}</div>
        ${preview ? `<div class="letter-preview">${preview}</div>` : ''}
        ${date ? `<div class="letter-date">${date}</div>` : ''}
      </a>`;
    }).join('');
  }

  // ── Render mood log ──────────────────────────────────────────────────
  function renderMoods() {
    const el = document.getElementById('moodList');
    let hist = [];
    try {
      hist = JSON.parse(localStorage.getItem('sheIs_mood_history') || '[]');
    } catch(e) {}
    if (!hist.length) {
      // Try today's single entry
      try {
        const today = JSON.parse(localStorage.getItem('sheIs_mood_today') || 'null');
        if (today && today.mood) hist = [today];
      } catch(e) {}
    }
    if (!hist.length) {
      el.innerHTML = '<p class="empty-tip">还没有打卡记录，去首页打卡吧</p>';
      return;
    }
    const show = [...hist].reverse().slice(0, 30);
    el.innerHTML = show.map(m => {
      const info = MOOD_MAP[m.mood] || { emoji: '💭', label: m.mood };
      const date = fmtDate(m.timestamp || m.date);
      return `<div class="mood-item">
        <span class="mood-emoji">${info.emoji}</span>
        <span class="mood-label">${info.label}</span>
        ${date ? `<span class="mood-date">${date}</span>` : ''}
      </div>`;
    }).join('');
  }

  // ── User auth ────────────────────────────────────────────────────────
  async function initUser() {
    if (typeof getUser !== 'function') {
      document.getElementById('guestNote').classList.remove('hidden');
      return;
    }
    try {
      const user = await getUser();
      if (user) {
        const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email?.split('@')[0] || '我';
        const header = document.getElementById('userHeader');
        const avatar = document.getElementById('avatarCircle');
        const nameEl = document.getElementById('userName');
        const emailEl = document.getElementById('userEmail');
        avatar.textContent = name.charAt(0).toUpperCase();
        nameEl.textContent = name;
        emailEl.textContent = user.email || '';
        header.classList.remove('hidden');
        // dark mode text fix
        nameEl.style.color = '';
        emailEl.style.color = '';
      } else {
        document.getElementById('loginBanner').classList.remove('hidden');
        document.getElementById('guestNote').classList.remove('hidden');
      }
    } catch(e) {
      document.getElementById('guestNote').classList.remove('hidden');
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────
  renderAssessments();
  renderLetters();
  renderMoods();
  initUser();
  </script>
</body>
</html>
