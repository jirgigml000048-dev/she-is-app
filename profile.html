<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="assets/theme-init.js"></script>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>女也 She Is - 内在景观</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
<script src="assets/profile-utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100dvh; }
  .font-serif { font-family: 'Noto Serif SC', 'Noto Serif', serif; }
  .nebula-mesh {
    background: radial-gradient(circle at 30% 20%, #4a3073 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, #9c3c62 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, #33185c 0%, transparent 50%);
    filter: blur(40px); opacity: 0.4;
  }
  .glass-card { background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  details[open] summary .chevron { transform: rotate(180deg); }
  .chevron { transition: transform 0.2s; }

  /* share sheet — used only by html2canvas */
  .ss-card { width: 390px; font-family: 'Noto Serif SC', serif; color: #2f2440; }
  .ss-top { background: linear-gradient(150deg,#33185c 0%,#4a3073 50%,#9c3c62 100%); padding:32px 28px 28px; }
  .ss-body { background:#fcf9f6; padding:24px 28px 28px; }
  .ss-brand { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:20px; }
  .ss-title { font-size:26px; font-weight:700; color:#fff; line-height:1.35; margin:0; }
  .ss-sub { font-size:13px; color:rgba(255,255,255,.5); font-style:italic; margin:6px 0 0; font-family:'Noto Serif',serif; }
  .ss-section { font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:#9c3c62; margin-bottom:12px; font-family:'Plus Jakarta Sans',sans-serif; }
  .ss-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(74,48,115,.07); }
  .ss-row:last-child { border-bottom:none; }
  .ss-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-right:8px; }
  .ss-dot-trait { background:#33185c; } .ss-dot-emotion { background:#9c3c62; } .ss-dot-behavior { background:#4a3073; } .ss-dot-motive { background:#bbb; }
  .ss-name { font-size:12px; color:#3a3047; flex:1; }
  .ss-val { font-size:11px; color:#4a3073; background:rgba(74,48,115,.08); padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .ss-val-pending { font-size:11px; color:#bbb; }
  .ss-divider { height:1px; background:rgba(74,48,115,.1); margin:18px 0; }
  .ss-p-cn { font-size:14px; line-height:1.9; color:#3a3047; margin:0 0 8px; }
  .ss-p-en { font-size:12px; line-height:1.7; color:#aaa; font-style:italic; font-family:'Noto Serif',serif; margin:0 0 14px; }
  .ss-footer { display:flex; justify-content:space-between; padding-top:16px; border-top:1px solid rgba(74,48,115,.1); }
  .ss-footer-url { font-size:10px; color:#bbb; letter-spacing:.08em; }
  .ss-footer-sign { font-size:11px; color:#9c3c62; }
  /* result card */
  .ss-result-top { background:linear-gradient(135deg,#33185c 0%,#6b3fa0 50%,#9c3c62 100%); padding:28px 28px 24px; position:relative; overflow:hidden; }
  .ss-result-top::before { content:''; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.06); }
  .ss-axis-tag { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#fff; padding:2px 7px; border-radius:999px; flex-shrink:0; font-family:'Plus Jakarta Sans',sans-serif; }
  .ss-axis-tag-trait { background:#33185c; } .ss-axis-tag-emotion { background:#9c3c62; } .ss-axis-tag-behavior { background:#4a3073; } .ss-axis-tag-motive { background:#bbb; }
  .ss-result-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(74,48,115,.07); }
  .ss-result-item:last-child { border-bottom:none; }
  .ss-result-val { font-size:11px; color:#4a3073; font-weight:600; white-space:nowrap; }
  .capture-stage { position:fixed; left:-99999px; top:0; width:390px; z-index:-1; }
</style>
</head>
<body class="bg-background min-h-screen pb-32">

<!-- hidden functional elements -->
<div id="headerUser" style="display:none;"></div>
<button id="logoutBtn" type="button" style="display:none;position:absolute;left:-9999px;">退出登录</button>
<div id="avatarDot" style="display:none;"></div>

<!-- TopAppBar -->
<div id="app-header"></div>
<script src="assets/header.js"></script>

<main class="pt-20 px-6 max-w-md mx-auto">
  <div id="profileRoot"></div>
</main>

<div id="app-nav"></div>
<script src="assets/nav.js"></script>

<!-- Capture stage for share images -->
<div id="captureStage" class="capture-stage"></div>

<!-- Share preview modal -->
<div id="sharePreviewModal" class="fixed inset-0 hidden items-center justify-center p-6 bg-[#2d2238]/50 z-[999]" aria-hidden="true">
  <div class="w-full max-w-sm max-h-[88vh] overflow-auto p-4 rounded-[24px] bg-white/96 shadow-2xl">
    <img id="sharePreviewImage" class="block w-full h-auto rounded-[18px]" alt="分享预览图" />
    <p class="text-xs text-outline text-center mt-2">长按图片保存</p>
  </div>
</div>

<script>
  const TEST_META = {
    cognitive:           { name: '荣格八维认知功能', nameEn: 'Cognitive Functions', href: 'test-cognitive.html' },
    hsp:                 { name: '高敏感测评',       nameEn: 'High Sensitivity',    href: 'test-hsp.html' },
    erq:                 { name: '情绪调节测评',     nameEn: 'Emotion Regulation',  href: 'test-erq.html' },
    ecr:                 { name: '依恋风格测评',     nameEn: 'Attachment Style',    href: 'test-ecr.html' },
    fmps:                { name: '完美主义测评',     nameEn: 'Perfectionism',       href: 'test-fmps.html' },
    'boundary-sense':    { name: '边界感测评',       nameEn: 'Boundary Sense',      href: 'test-boundary-sense.html' },
    'relationship-role': { name: '关系角色测评',     nameEn: 'Relationship Role',   href: 'test-relationship-role.html' },
    disc:                { name: '行为风格测评',     nameEn: 'DISC Style',          href: 'test-disc.html' }
  };

  const AXES = [
    {
      key: 'trait', name: '特质轴', nameEn: 'Trait Axis', short: '特质',
      meaning: '你是谁', description: '你如何感知、思考、做决策——这是你最底层的操作系统',
      items: [{ key: 'cognitive', label: 'cognitive' }]
    },
    {
      key: 'emotion', name: '情绪轴', nameEn: 'Emotion Axis', short: '情绪',
      meaning: '你怎么感受', description: '你如何感受、消化、应对情绪——这里藏着你消耗最多能量的地方',
      items: [{ key: 'hsp', label: 'hsp' }, { key: 'erq', label: 'erq' }, { key: 'ecr', label: 'ecr' }]
    },
    {
      key: 'behavior', name: '行为轴', nameEn: 'Behavior Axis', short: '行为',
      meaning: '你怎么行动', description: '你如何行动、设标准、划边界——这决定了你和世界的互动方式',
      items: [{ key: 'fmps', label: 'fmps' }, { key: 'boundary-sense', label: 'boundary-sense' }, { key: 'relationship-role', label: 'relationship-role' }, { key: 'disc', label: 'disc' }]
    },
    {
      key: 'motive', name: '动机轴', nameEn: 'Motivation Axis', short: '动机',
      meaning: '你为什么这样', description: '你为什么是这样的你——驱动力和恐惧的根源（即将上线）',
      placeholder: true,
      items: [{ key: 'enneagram', label: '九型人格', soon: true }, { key: 'holland', label: '霍兰德', soon: true }]
    }
  ];

  // axis accent colors
  const AXIS_COLOR = {
    trait:    { border: 'border-primary',   badge: 'bg-primary/10 text-primary',         bar: 'bg-primary'   },
    emotion:  { border: 'border-secondary', badge: 'bg-secondary/10 text-secondary',     bar: 'bg-secondary' },
    behavior: { border: 'border-primary-container', badge: 'bg-primary-container/10 text-primary-container', bar: 'bg-primary-container' },
    motive:   { border: 'border-outline',   badge: 'bg-surface-container text-outline',  bar: 'bg-outline'   },
  };

  const PORTRAIT_FRAGMENTS = {
    cognitive_F:    { cn: '你有很强的感知力，也很在意人和情境之间的细小变化。',     en: 'You sense deeply — the quiet shifts between people, the unspoken weight in a room.' },
    cognitive_T:    { cn: '你更习惯先搭建理解世界的结构，再决定如何行动。',         en: 'You build frameworks before you act — a mind that maps before it moves.' },
    hsp_high:       { cn: '你对外界信号的接收很强，很多人忽略的细节，你会先感到。', en: 'You receive the world at full volume — details others miss land on you first.' },
    hsp_other:      { cn: '你对世界有自己的感受阈值，既能接收，也会主动筛选。',     en: 'You have your own threshold — open enough to feel, grounded enough to filter.' },
    erq_think:      { cn: '情绪来时，你习惯先换一个角度看它，让自己慢慢回到可处理的位置。', en: 'When emotions arrive, you reframe before you react — thinking your way back to steady.' },
    erq_dual:       { cn: '你既会处理情绪本身，也会试着照顾它在外部关系里的影响。', en: 'You hold two things at once: your inner weather, and how it lands on the people around you.' },
    erq_suppress:   { cn: '你常常先把情绪压住，等事情过去以后，才轮到自己慢慢消化。', en: 'You press pause on feeling — holding it together until you finally have space to let it through.' },
    erq_flow:       { cn: '你和情绪相处的方式更顺流，很多反应会先在身体里发生。',   en: 'Emotions move through you naturally — your body often knows before your mind catches up.' },
    ecr_anxious:    { cn: '关系里你渴望靠近，也会反复确认对方是不是还在。',         en: 'In relationships, you reach — and reach again — making sure the connection is still there.' },
    ecr_fearful:    { cn: '你想亲近，但亲近本身也会让你紧张，靠近和退后常常同时发生。', en: 'You want closeness, but closeness makes you nervous — the push and pull happen at the same time.' },
    ecr_dismissive: { cn: '你习惯先靠自己，哪怕心里有需要，也不会立刻把它说出口。', en: 'You default to self-reliance — your needs exist, but you rarely let them speak first.' },
    ecr_secure:     { cn: '你在关系里更能稳定表达需要，也更容易给彼此空间。',       en: 'You can ask for what you need, and give room for the other person to do the same.' },
    fmps_high:      { cn: '你对自己有比较高的要求，很多标准是在心里先过一遍的。',   en: 'You hold yourself to a high bar — most things get measured against an inner standard first.' },
    fmps_low:       { cn: '你会在标准和现实之间找平衡，不轻易被单一目标绑住。',     en: 'You seek balance between ideal and real — unwilling to be held hostage by a single standard.' },
  };

  const profileRoot       = document.getElementById('profileRoot');
  const headerUser        = document.getElementById('headerUser');
  const logoutBtn         = document.getElementById('logoutBtn');
  const captureStage      = document.getElementById('captureStage');
  const sharePreviewModal = document.getElementById('sharePreviewModal');
  const sharePreviewImage = document.getElementById('sharePreviewImage');
  const avatarDot         = document.getElementById('avatarDot');

  function esc(v) {
    return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function getDisplayName(u) {
    return u?.user_metadata?.name || u?.user_metadata?.full_name || u?.email?.split('@')[0] || '你';
  }
  function normalizeResults(results) {
    const m = new Map();
    (results||[]).forEach(item => {
      if (!item?.test_name) return;
      const ex = m.get(item.test_name);
      const et = ex?.completed_at ? new Date(ex.completed_at).getTime() : 0;
      const ct = item.completed_at ? new Date(item.completed_at).getTime() : 0;
      if (!ex || ct >= et) m.set(item.test_name, item);
    });
    return m;
  }
  function getLocalResultMap() {
    const m = new Map();
    if (!window.SheProfileStore) return m;
    window.SheProfileStore.readAllResults().forEach(item => m.set(item.moduleId, item));
    return m;
  }
  function getResultLabel(key, local, remote) {
    if (local?.summary) {
      if (key === 'cognitive') return local.summary.toUpperCase();
      if (key === 'hsp') {
        if (local.summary === '高敏感') return '高敏感';
        if (local.summary === '中敏感') return '中等感受力';
        if (local.summary === '低敏感') return '低敏感倾向';
      }
      return local.summary;
    }
    if (remote?.result_type) return remote.result_type;
    return '';
  }
  function buildAxisData(remoteMap, localMap) {
    return AXES.map(axis => {
      const items = axis.items.map(item => {
        if (item.soon) return { ...item, state: 'soon' };
        const local  = localMap.get(item.key);
        const remote = remoteMap.get(item.key);
        const done   = Boolean(local || remote);
        return {
          ...item,
          state:  done ? 'done' : 'todo',
          href:   TEST_META[item.key]?.href || '#',
          name:   TEST_META[item.key]?.name || item.key,
          nameEn: TEST_META[item.key]?.nameEn || '',
          value:  done ? getResultLabel(item.key, local, remote) : '',
          local, remote
        };
      });
      const total     = items.filter(i => !i.soon).length;
      const doneCount = items.filter(i => i.state === 'done').length;
      let score = 0;
      if (axis.key === 'trait')    score = doneCount ? 1 : 0;
      if (axis.key === 'emotion')  score = doneCount / 3;
      if (axis.key === 'behavior') score = doneCount / 4;
      return { ...axis, items, total, doneCount, score };
    });
  }
  function buildPortrait(itemsMap) {
    const done = Array.from(itemsMap.values()).filter(i => i.state === 'done');
    if (done.length < 3) return null;
    const pairs = [];
    const cognitive = itemsMap.get('cognitive')?.value;
    const hsp       = itemsMap.get('hsp')?.value;
    const erq       = itemsMap.get('erq')?.value;
    const ecr       = itemsMap.get('ecr')?.value;
    const fmps      = itemsMap.get('fmps')?.value;
    const boundary  = itemsMap.get('boundary-sense')?.value;
    const role      = itemsMap.get('relationship-role')?.value;

    if (cognitive) pairs.push(PORTRAIT_FRAGMENTS[cognitive.includes('F') ? 'cognitive_F' : 'cognitive_T']);
    else if (hsp)  pairs.push(PORTRAIT_FRAGMENTS[hsp === '高敏感' ? 'hsp_high' : 'hsp_other']);

    if (erq) {
      if (erq.includes('思考派'))   pairs.push(PORTRAIT_FRAGMENTS.erq_think);
      else if (erq.includes('双管派')) pairs.push(PORTRAIT_FRAGMENTS.erq_dual);
      else if (erq.includes('压下去派')) pairs.push(PORTRAIT_FRAGMENTS.erq_suppress);
      else pairs.push(PORTRAIT_FRAGMENTS.erq_flow);
    }
    if (ecr) {
      if (ecr.includes('专注型'))   pairs.push(PORTRAIT_FRAGMENTS.ecr_anxious);
      else if (ecr.includes('恐惧型')) pairs.push(PORTRAIT_FRAGMENTS.ecr_fearful);
      else if (ecr.includes('冷漠型')) pairs.push(PORTRAIT_FRAGMENTS.ecr_dismissive);
      else pairs.push(PORTRAIT_FRAGMENTS.ecr_secure);
    }
    if (fmps) {
      pairs.push(PORTRAIT_FRAGMENTS[fmps.includes('高') || fmps.includes('严格') ? 'fmps_high' : 'fmps_low']);
    } else if (boundary || role) {
      const cn = boundary ? `你在边界上更接近${boundary}，这会直接影响你怎么和世界相处。` : `在关系里，你常常先以${role}的方式出现。`;
      const en = boundary ? 'Your sense of boundary shapes how you meet the world — and where you draw the line.' : 'In relationships, you often show up as the one who holds things together.';
      pairs.push({ cn, en });
    }
    return pairs.slice(0, 3);
  }

  /* ── Login Prompt ── */
  function renderLoginPrompt() {
    logoutBtn.style.display = 'none';
    profileRoot.innerHTML = `
      <section class="mt-8 mb-12">
        <div class="flex flex-col gap-1">
          <span class="text-[10px] uppercase tracking-[0.2em] text-primary/60 font-medium">Map / 个人地图</span>
          <h2 class="font-headline text-4xl text-primary leading-tight">你是多维的存在<br><span class="italic text-3xl opacity-80">Inner Landscape</span></h2>
        </div>
      </section>
      <section class="bg-surface-container-lowest rounded-lg p-8 shadow-sm border border-outline-variant/20 text-center">
        <h3 class="font-headline text-2xl text-primary mb-3">先登录，再看你的地图</h3>
        <p class="text-sm text-on-surface-variant/70 mb-6 leading-relaxed">登录后，你做过的测评结果会自动归档在这里。<br>未登录状态下，不展示任何测评记录。</p>
        <button class="bg-gradient-to-r from-primary to-primary-container text-on-primary px-8 py-3 rounded-lg font-label text-sm uppercase tracking-widest font-bold hover:opacity-90 transition-all active:scale-95" type="button" onclick="openLoginModal()">立即登录</button>
      </section>
    `;
    injectLoginModal();
  }

  /* ── Profile ── */
  function renderProfile(user, remoteResults) {
    const remoteMap  = normalizeResults(remoteResults);
    const localMap   = getLocalResultMap();
    const axes       = buildAxisData(remoteMap, localMap);
    const itemsMap   = new Map();
    axes.forEach(axis => axis.items.forEach(item => itemsMap.set(item.key, item)));
    const portrait   = buildPortrait(itemsMap);

    const displayName = getDisplayName(user);
    headerUser.textContent = `${displayName}\n${user.email||''}`;
    logoutBtn.style.display = 'inline';
    if (avatarDot) avatarDot.textContent = displayName.charAt(0).toUpperCase();

    const coreItem = itemsMap.get('cognitive');
    const coreType = coreItem?.state === 'done' ? esc(coreItem.value) : '?';
    const nebulaEmpty = !axes.some(a => a.items.some(i => i.state === 'done'));

    // floating labels for nebula
    const doneItems = axes.flatMap(a => a.items.filter(i => i.state === 'done').map(i => ({ ...i, axisKey: a.key })));
    const floatPositions = [
      'absolute top-[10%] right-[5%]',
      'absolute bottom-[20%] left-[0%]',
      'absolute top-[40%] left-[-5%] scale-90',
      'absolute bottom-[8%] right-[8%] scale-90',
      'absolute top-[62%] right-[-2%] scale-75',
    ];
    const floatColors = {
      trait: 'text-primary', emotion: 'text-secondary', behavior: 'text-primary-container', motive: 'text-outline'
    };

    const floatTags = doneItems.slice(0, 5).map((item, i) => {
      const pos = floatPositions[i] || 'absolute top-[50%] right-[5%]';
      const col = floatColors[item.axisKey] || 'text-primary';
      return `<div class="${pos} glass-card px-4 py-2 rounded-full shadow-sm border border-white/40">
        <span class="text-xs font-semibold ${col}">${esc(item.value)}</span>
      </div>`;
    }).join('');

    // axis accordion items
    // 展开状态：emotion 轴有结果时默认展开，其余折叠
    const axisHTML = axes.map(axis => {
      const ac = AXIS_COLOR[axis.key];
      const isExpanded = false;
      const headingBorder = `border-l-4 ${ac.border} pl-3`;
      const expandIcon = 'unfold_more';

      const itemsHTML = axis.items.map(item => {
        if (item.soon) return `
          <div class="bg-surface-container-low p-5 rounded-lg opacity-50">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="text-sm font-bold text-on-surface-variant">${esc(item.label)}</h4>
                <p class="text-[10px] text-on-surface-variant/50 uppercase mt-0.5">Coming Soon</p>
              </div>
              <span class="text-xs text-outline bg-surface-container px-2 py-0.5 rounded">即将上线</span>
            </div>
          </div>`;
        if (item.state === 'done') return `
          <a href="${item.href}?view=result" class="block bg-surface-container-lowest p-5 rounded-lg shadow-sm border-l-2 ${ac.border} hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-3">
              <div>
                <h4 class="text-sm font-bold text-primary">${esc(item.name)}</h4>
                <p class="text-[10px] text-on-surface-variant/60 uppercase mt-0.5">${esc(item.nameEn)}</p>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded ${ac.badge}">${esc(item.value)}</span>
            </div>
            <div class="w-full bg-surface-container h-1 rounded-full overflow-hidden">
              <div class="${ac.bar} h-full w-full rounded-full"></div>
            </div>
          </a>`;
        return `
          <a href="${item.href}" class="block bg-surface-container-low p-5 rounded-lg border border-dashed border-outline-variant/40 hover:border-primary/30 transition-colors">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="text-sm font-bold text-on-surface-variant/70">${esc(item.name)}</h4>
                <p class="text-[10px] text-on-surface-variant/50 uppercase mt-0.5">${esc(item.nameEn)}</p>
              </div>
              <span class="text-xs text-on-surface-variant/40">去做 →</span>
            </div>
          </a>`;
      }).join('');

      const collapsedBar = `
        <div class="bg-surface-container-low rounded-lg p-1 axis-collapsed-bar" data-axis="${axis.key}">
          <div class="h-12 flex items-center px-4 cursor-pointer" onclick="toggleAxis('${axis.key}')">
            <div class="flex gap-2">
              ${axis.items.filter(i => !i.soon).map(i =>
                `<span class="w-1.5 h-1.5 rounded-full ${i.state === 'done' ? ac.bar : 'bg-primary/20'}"></span>`
              ).join('')}
            </div>

      const expandedItems = `<div class="space-y-3 axis-expanded-items hidden" data-axis="${axis.key}">${itemsHTML}</div>`;

      return `
        <div class="group" id="axis-block-${axis.key}">
          <div class="flex justify-between items-end mb-4 px-2">
            <div>
              <h3 class="font-headline text-xl text-primary ${headingBorder}">
                ${axis.name} <span class="text-sm font-sans italic opacity-60 ml-2">${axis.nameEn}</span>

          ${collapsedBar}
          ${expandedItems}

    // portrait section — all CN first, then all EN
    const portraitHTML = portrait
      ? `<div class="space-y-1 mb-4">

    profileRoot.innerHTML = `
      <!-- Hero -->
      <section class="mt-8 mb-12">

          <!-- Content Overlay -->
          <div class="z-10 text-center">
            <div class="text-[10px] text-primary/60 uppercase tracking-[0.2em] mb-1 font-bold">${nebulaEmpty ? 'Start Exploring' : 'Core Identity'}</div>
            <div class="font-headline text-3xl text-primary font-bold tracking-widest">${coreType}</div>
          </div>
        </div>

      <!-- Four Axis Framework -->
      <div class="space-y-8 mb-16">
        ${axisHTML}

      <!-- Portrait -->
      <section class="bg-surface-container-lowest rounded-lg p-6 shadow-sm border border-outline-variant/20 mb-8">
        <div class="flex items-baseline gap-3 mb-4 pb-3 border-b border-outline-variant/20">
          <h3 class="font-headline text-lg text-primary">文字画像</h3>
          <span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/50 font-label">Portrait</span>

      <!-- Share -->

          <button id="shareLongBtn" class="border border-primary/30 rounded-lg py-3 text-sm font-bold text-primary font-label hover:bg-primary/5 transition-colors active:scale-95" type="button">整体画像长图</button>
          <button id="shareResultBtn" class="border border-primary/30 rounded-lg py-3 text-sm font-bold text-primary font-label hover:bg-primary/5 transition-colors active:scale-95" type="button">测评结果卡</button>
        </div>
        <p class="text-[11px] text-on-surface-variant/50 text-center mt-3">会按当前真实结果生成图片并下载到本地。</p>
      </section>

      <!-- Mood History -->
      <section class="bg-surface-container-lowest rounded-lg p-6 shadow-sm border border-outline-variant/20 mb-8" id="moodHistorySection" style="display:none">
        <div class="flex items-baseline gap-3 mb-4 pb-3 border-b border-outline-variant/20">

      <section class="bg-surface-container-lowest rounded-lg p-6 shadow-sm border border-outline-variant/20 mb-8" id="lettersSection" style="display:none">
        <div class="flex items-baseline gap-3 mb-4 pb-3 border-b border-outline-variant/20">
          <h3 class="font-headline text-lg text-primary">我的留言</h3>
          <span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/50 font-label">Letters</span>

      <!-- Test Timeline -->

          <h3 class="font-headline text-lg text-primary">成长轨迹</h3>
          <span class="text-[10px] uppercase tracking-[0.2em] text-on-surface-variant/50 font-label">Timeline</span>

        <div id="testTimelineContent"></div>

      <!-- CTA -->
      <section class="text-center mb-8">
        <p class="text-sm text-on-surface-variant/70 mb-6 font-serif italic">"景观随心而动，探索从未止步。"</p>
        <a href="assessment.html" class="inline-block bg-gradient-to-r from-primary to-primary-container text-on-primary px-10 py-4 rounded-lg shadow-xl text-sm font-bold tracking-widest uppercase transition-transform active:scale-95 font-label">
          开启深度探索 / Start Exploration
        </a>
      </section>
    `;

    document.getElementById('shareLongBtn').addEventListener('click',   () => shareImage('long',   { axes, portrait }));
    document.getElementById('shareResultBtn').addEventListener('click', () => shareImage('result', { axes, portrait }));
    renderMoodHistory();
    renderLetters();
    renderTestTimeline();
  }

  /* ── Share HTML builders ── */
  function buildLongHTML({ axes, portrait }) {
    const allItems = axes.flatMap(a => a.items.filter(i => !i.soon).map(i => ({ ...i, axisKey: a.key, axisName: a.name })));
    const cnText = portrait ? portrait.map(p => `<p class="ss-p-cn">${esc(p.cn)}</p>`).join('') : '<p class="ss-p-en">完成更多测评解锁画像。</p>';
    const enText = portrait ? portrait.map(p => `<p class="ss-p-en">${esc(p.en)}</p>`).join('') : '';
    return `<div class="ss-card">
      <div class="ss-top">
        <p class="ss-brand">女也 She Is ______.</p>
        <h2 class="ss-title">你是多维的存在</h2>
        <p class="ss-sub">You are not a single type.</p>
      </div>
      <div class="ss-body">
        <p class="ss-section">Assessment Results / 测评结果</p>
        ${allItems.map(item => `
          <div class="ss-row">
            <div style="display:flex;align-items:center;flex:1;min-width:0;">
              <div class="ss-dot ss-dot-${item.axisKey}"></div>
              <span class="ss-name">${esc(item.name)}</span>
            </div>
            ${item.state === 'done' ? `<span class="ss-val">${esc(item.value)}</span>` : `<span class="ss-val-pending">—</span>`}
          </div>`).join('')}
        <div class="ss-divider"></div>
        <p class="ss-section">Portrait / 文字画像</p>
        ${cnText}
        ${enText}
        <div class="ss-footer">
          <span class="ss-footer-url">she-is-app.netlify.app</span>
          <span class="ss-footer-sign">女也 · She Is</span>
        </div>
      </div>
    </div>`;
  }

  function buildResultHTML({ axes }) {
    return `<div class="ss-card">
      <div class="ss-result-top">
        <p class="ss-brand">女也 She Is ______.</p>
        <h2 class="ss-title">你不是一个<br>单一的类型。</h2>
        <p class="ss-sub">You are not a single type.</p>
      </div>
      <div class="ss-body">
        ${axes.flatMap(a => a.items.filter(i => !i.soon).map(item => `
          <div class="ss-result-item">
            <span class="ss-axis-tag ss-axis-tag-${a.key}">${a.short}</span>
            <span class="ss-name">${esc(item.name)}</span>
            ${item.state === 'done' ? `<span class="ss-result-val">${esc(item.value)}</span>` : `<span class="ss-val-pending">—</span>`}
          </div>`)).join('')}
        <div class="ss-footer" style="margin-top:16px;">
          <span class="ss-footer-sign" style="font-style:italic;">The inner gaze is a fierce act of love.</span>
          <span class="ss-footer-url">she-is-app.netlify.app</span>
        </div>
      </div>
    </div>`;
  }

  async function shareImage(type, data) {
    const btnId = type === 'long' ? 'shareLongBtn' : 'shareResultBtn';
    const btn = document.getElementById(btnId);
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = '生成中…';
    try {
      captureStage.innerHTML = type === 'long' ? buildLongHTML(data) : buildResultHTML(data);
      const node = captureStage.firstElementChild;
      const canvas = await html2canvas(node, { backgroundColor: '#fcf9f6', scale: Math.min(window.devicePixelRatio * 3, 4), useCORS: true });
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = type === 'long' ? 'profile-long.png' : 'profile-result.png';
      a.href = url; a.click();
      sharePreviewImage.src = url;
      sharePreviewModal.classList.remove('hidden');
      sharePreviewModal.classList.add('flex');
      sharePreviewModal.setAttribute('aria-hidden', 'false');
      captureStage.innerHTML = '';
    } catch(e) {
      console.error(e); alert('生成图片失败，请稍后再试。');
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  sharePreviewModal.addEventListener('click', e => {
    if (e.target === sharePreviewModal) {
      sharePreviewModal.classList.add('hidden');
      sharePreviewModal.classList.remove('flex');
      sharePreviewModal.setAttribute('aria-hidden', 'true');
      sharePreviewImage.removeAttribute('src');
    }
  });

  /* ── Mood History ── */
  function renderMoodHistory() {
    const section = document.getElementById('moodHistorySection');
    const grid = document.getElementById('moodHistoryGrid');
    const legend = document.getElementById('moodLegend');
    if (!section || !grid) return;
    let history = [];
    try { history = JSON.parse(localStorage.getItem('sheIs_mood_history') || '[]'); } catch(e) {}
    if (history.length === 0) return;
    section.style.display = '';

    // Build 30-day calendar grid (today at the end)
    const now = new Date();
    const moodMap = {};
    history.forEach(h => {
      const d = new Date(h.timestamp).toDateString();
      moodMap[d] = h; // last entry per day wins
    });
    const moodLabels = { calm:'平静', anxious:'焦虑', tired:'疲惫', alive:'有活力', numb:'麻木', sad:'悲伤', grateful:'感恩', overwhelmed:'压力大' };
    const seenMoods = new Set();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.toDateString();
      const entry = moodMap[key];
      const cell = document.createElement('div');
      cell.className = 'aspect-square rounded-md flex items-center justify-center text-[9px] font-label';
      if (entry) {
        cell.style.background = entry.color;
        cell.style.color = '#fff';
        cell.textContent = d.getDate();
        cell.title = moodLabels[entry.mood] || entry.mood;
        seenMoods.add(entry.mood);
      } else {
        cell.style.background = 'rgba(74,48,115,0.04)';
        cell.style.color = 'rgba(74,48,115,0.25)';
        cell.textContent = d.getDate();
      }
      grid.appendChild(cell);
    }
    // Legend
    if (legend) {
      legend.innerHTML = Array.from(seenMoods).slice(0, 5).map(m => {
        const entry = history.find(h => h.mood === m);
        return `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${entry?.color || '#ccc'}"></span>${moodLabels[m] || m}</span>`;
      }).join('');
    }
  }

  /* ── My Letters ── */
  function renderLetters() {
    const section = document.getElementById('lettersSection');
    const list = document.getElementById('lettersList');
    if (!section || !list) return;
    let letters = [];
    try { letters = JSON.parse(localStorage.getItem('sheIs_letters') || '[]'); } catch(e) {}
    if (letters.length === 0) return;
    section.style.display = '';

    letters.slice(0, 10).forEach(letter => {
      const d = new Date(letter.createdAt);
      const dateStr = d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
      const card = document.createElement('div');
      card.className = 'p-4 rounded-lg bg-surface-container-low border border-outline-variant/10';
      card.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <h4 class="text-sm font-bold text-on-surface font-headline">${esc(letter.subject)}</h4>
          <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-[10px] text-on-surface-variant/50 font-label">${dateStr}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full ${letter.isPublic ? 'bg-primary/10 text-primary' : 'bg-surface-container text-outline'} font-label">${letter.isPublic ? '公开' : '私密'}</span>
          </div>
        </div>
        <p class="text-xs text-on-surface-variant/70 leading-relaxed line-clamp-3">${esc(letter.body)}</p>`;
      list.appendChild(card);
    });
    if (letters.length > 10) {
      const more = document.createElement('p');
      more.className = 'text-center text-[10px] text-on-surface-variant/40 font-label mt-3';
      more.textContent = `共 ${letters.length} 封留言`;
      list.appendChild(more);
    }
  }

  /* ── Test Timeline ── */
  function renderTestTimeline() {
    const section = document.getElementById('testTimelineSection');
    const content = document.getElementById('testTimelineContent');
    if (!section || !content || !window.SheProfileStore?.readAllHistory) return;
    const allHistory = window.SheProfileStore.readAllHistory();
    const modules = Object.entries(allHistory).filter(([, h]) => h.length > 1);
    if (modules.length === 0) return;
    section.style.display = '';

    const nameMap = { cognitive: '荣格认知', 'cognitive-48': '荣格认知48', hsp: '高敏感度', ecr: '依恋类型', erq: '情绪调节', fmps: '完美主义', 'boundary-sense': '边界感', disc: 'DISC行为' };
    modules.forEach(([moduleId, history]) => {
      const name = nameMap[moduleId] || moduleId;
      const wrap = document.createElement('div');
      wrap.className = 'mb-5';
      wrap.innerHTML = `<div class="text-[10px] text-on-surface-variant/50 font-label tracking-widest uppercase mb-3">${esc(name)}</div>`;
      const track = document.createElement('div');
      track.className = 'flex items-start gap-0';
      const recent = history.slice(-5);
      recent.forEach((entry, i) => {
        const isLatest = i === recent.length - 1;
        const d = new Date(entry.completedAt);
        const label = d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        const summary = entry.summary || '';
        const dot = document.createElement('div');
        dot.className = 'flex flex-col items-center gap-1';
        dot.style.minWidth = '56px';
        dot.innerHTML = `
          <div class="rounded-full flex-shrink-0 ${isLatest ? 'w-3 h-3 bg-primary' : 'w-2 h-2 bg-primary/25'}"></div>
          <span class="text-[9px] text-on-surface-variant/50 font-label">${label}</span>
          <span class="text-[10px] ${isLatest ? 'text-primary font-bold' : 'text-on-surface-variant/60'} font-headline text-center">${esc(summary).substring(0, 8)}</span>`;
        track.appendChild(dot);
        if (i < recent.length - 1) {
          const line = document.createElement('div');
          line.className = 'flex-1 h-px bg-outline-variant/30 mt-[5px]';
          track.appendChild(line);
        }
      });
      wrap.appendChild(track);
      content.appendChild(wrap);
    });
  }

  function toggleAxis(key) {
    const bar   = document.querySelector(`.axis-collapsed-bar[data-axis="${key}"]`);
    const items = document.querySelector(`.axis-expanded-items[data-axis="${key}"]`);
    const icon  = document.getElementById(`axis-icon-${key}`);
    if (!items) return;
    const isHidden = items.classList.contains('hidden');
    items.classList.toggle('hidden', !isHidden);
    if (bar) bar.classList.toggle('hidden', isHidden);
    if (icon) icon.textContent = isHidden ? 'unfold_less' : 'unfold_more';
  }

  logoutBtn.addEventListener('click', signOut);

  async function init() {
    try {
      injectLoginModal();
      const user = await getUser();
      if (!user) { renderLoginPrompt(); return; }
      const results = await getUserResults();
      renderProfile(user, results);
    } catch(e) {
      console.error(e);
      profileRoot.innerHTML = `<section class="bg-surface-container-lowest rounded-lg p-8 shadow-sm text-center mt-8">
        <h3 class="font-headline text-xl text-primary mb-3">结果暂时没有加载出来</h3>
        <p class="text-sm text-on-surface-variant/70">请刷新页面再试一次。</p>
      </section>`;
    }
  }
  init();
</script>
