<html lang="zh-CN">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-family: 'Material Symbols Outlined'; }
    :root {
      --bg: #FAF7F4;
      --accent: #4A3073;
      --accent-hover: #3D2565;
      --text: #1E1628;
      --text-muted: rgba(30,22,40,0.5);
      --border: rgba(74,48,115,0.12);
      --btn-bg: rgba(180,155,225,0.22);
      --btn-border: rgba(190,165,235,0.45);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif SC', Georgia, serif;
      min-height: 100vh;
      max-width: 680px;
      margin: 0 auto;
      padding-bottom: 120px;
      padding-top: 72px;
    }
    header.visible { opacity: 1 !important; }
    .map-container { padding: 16px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
    .map-container svg { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; }
    .hint { text-align: center; font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-top: 12px; width: 100%; font-family: 'Noto Sans SC', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mood-section { margin: 24px 24px 0; }
    .mood-inline-picker { margin-top: 20px; background: rgba(245,240,235,0.6); border-radius: 12px; padding: 16px; }
    .mood-inline-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(74,48,115,0.5); font-family: 'Noto Sans SC', sans-serif; text-align: center; margin-bottom: 12px; }
    .mood-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mood-capsule { background: rgba(255,255,255,0.7); border: 1px solid rgba(74,48,115,0.15); border-radius: 100px; padding: 8px 12px; font-size: 11px; font-family: 'Noto Sans SC', sans-serif; color: rgba(30,22,40,0.75); cursor: pointer; transition: all 0.2s; text-align: center; }
    .mood-capsule:hover { background: rgba(74,48,115,0.08); }
    .mood-capsule.selected { border-color: var(--accent); background: rgba(74,48,115,0.12); color: var(--accent); font-weight: 600; }

    .mood-title { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 12px; text-align: center; font-family: 'Noto Sans SC', sans-serif; text-transform: uppercase; }
    .mood-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .mood-cell { aspect-ratio: 1; border-radius: 2px; display: flex; align-items: center; justify-content: center; }
    .mood-day { font-size: 7px; color: rgba(74,48,115,0.4); font-family: 'Lora', serif; }
    .narrative-section { margin: 32px 24px 0; opacity: 0; transition: opacity 2s ease; }

    .narrative-line { flex: 1; height: 1px; background: var(--border); }

    .cta-card:hover { background: rgba(74,48,115,0.04); }

    .share-name { font-size: 20px; font-family: 'Lora', serif; font-style: italic; font-weight: 300; color: var(--text); margin-bottom: 6px; letter-spacing: 3px; }
    .share-type { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 16px; font-family: 'Noto Sans SC', sans-serif; }

    /* ─── 四轴画像 区块 ─── */

    .axes-list { display: flex; flex-direction: column; gap: 12px; padding: 0 24px; }

    /* ─── 画像轴卡片 ─── */
    .axis-card {
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #fff;
      overflow: hidden;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 2px 12px rgba(74,48,115,0.05);

    .axis-card:hover {
      box-shadow: 0 4px 20px rgba(74,48,115,0.10);
      border-color: rgba(74,48,115,0.2);
    }
    .axis-card.completed {
      border-color: rgba(74,48,115,0.18);
      background: linear-gradient(135deg, #fff 0%, rgba(74,48,115,0.03) 100%);
    }
    .axis-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .axis-card-header::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      border-radius: 0 2px 2px 0;
      transition: opacity 0.2s;

    .axis-card.completed .axis-card-header::before { opacity: 0.4; }
    .axis-card.open .axis-card-header::before { opacity: 1; }

    .axis-card-name {

      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 4px;

      font-size: 10px;

      letter-spacing: 1.5px;

      font-style: italic;

    .map-cta-sub { font-size: 10px; color: var(--text-muted); margin-top: 10px; font-family: 'Noto Sans SC', sans-serif; letter-spacing: 0.5px; }

<script>
  // ─── VI Colors ──────────────────────────────────────────────
  const ACCENT = '#4A3073';
  const ACCENT_LIGHT = 'rgba(74,48,115,0.45)';
  const ACCENT_FAINT = 'rgba(74,48,115,0.18)';
  const BG = '#FAF7F4';

  function safeScore(result) {
    if (!result) return '—';
    const s = result.score;
    if (s == null) return '—';
    if (typeof s === 'object') {
      // Extract numeric value: prefer .total, otherwise sum all numeric values
      if (s.total != null) return String(Math.round(Number(s.total)));
      const vals = Object.values(s).filter(v => typeof v === 'number');
      if (vals.length) return String(Math.round(vals.reduce((a, b) => a + b, 0)));
      return '—';
    }
    return String(Math.round(Number(s)));
  }
  function safeSummary(result) {
    if (!result) return '';
    return result.summary || result.topDimension || '';
  }

  // ─── Region definitions ──────────────────────────────────────
  const REGION_DEFS = [
    { id: 'trait',      label: '特质轴', labelEn: 'Trait Axis',      cx: 200, cy: 180, baseRadius: 130, description: '认知功能的山脊线', moduleIds: ['cognitive', 'cognitive-48'], color: ACCENT },
    { id: 'emotion',    label: '情绪轴', labelEn: 'Emotion Axis',    cx: 420, cy: 200, baseRadius: 140, description: '情感的深水区',     moduleIds: ['hsp', 'ecr', 'erq'],            color: ACCENT },
    { id: 'behavior',   label: '行为轴', labelEn: 'Behavior Axis',   cx: 300, cy: 380, baseRadius: 120, description: '行为的河床与纹路', moduleIds: ['fmps', 'boundary-sense', 'disc'], color: ACCENT },
    { id: 'motivation', label: '动机轴', labelEn: 'Motivation Axis', cx: 480, cy: 400, baseRadius: 110, description: '尚未探索的区域', moduleIds: ['abm-love-animal', 'ideal-boyfriend'], color: 'rgba(74,48,115,0.35)' },
  ];

  function loadResults() {
    if (!window.SheProfileStore) return {};
    const all = window.SheProfileStore.readAllResults();
    const map = {};
    all.forEach(r => { map[r.moduleId] = r; });
    // Normalize: treat 'cognitive-48' and 'cognitive' as the same module
    if (map['cognitive'] && !map['cognitive-48']) map['cognitive-48'] = map['cognitive'];
    if (map['cognitive-48'] && !map['cognitive']) map['cognitive'] = map['cognitive-48'];
    return map;
  }

  function buildRegions(results) {
    return REGION_DEFS.map(def => {
      const hasAny = def.moduleIds.some(id => results[id]);
      const completed = hasAny;
      let seed = def.id === 'trait' ? 1.7 : def.id === 'emotion' ? 3.2 : def.id === 'behavior' ? 5.1 : 2.4;
      let layers = 5;
      let radius = def.baseRadius;
      if (completed) {
        const scores = def.moduleIds.map(id => {
          const s = results[id]?.score;
          if (s == null) return null;
          const n = typeof s === 'object' ? Object.values(s)[0] : Number(s);
          return isNaN(n) ? null : n;
        }).filter(s => s != null);
        if (scores.length > 0) {
          const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
          if (!isNaN(avg) && avg > 0) {
            const norm = Math.min(1, avg / 100);
            layers = Math.round(4 + norm * 5);
            radius = def.baseRadius * (0.85 + norm * 0.25);
            seed = def.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0) / 100 + avg / 50;
          }
        }
      }
      return { ...def, completed, seed, layers, radius };
    });
  }

  function generateContourPaths(seed, layers, cx, cy, radius) {
    const paths = [];
    for (let i = 0; i < layers; i++) {
      const r = radius - i * (radius / layers) * 0.65;
      const points = 14;
      let d = 'M ';
      for (let j = 0; j <= points; j++) {
        const angle = (j / points) * Math.PI * 2;
        const noise = Math.sin(seed * 3 + j * 2.1 + i * 1.3) * r * 0.15
                    + Math.cos(seed * 2 + j * 1.7 + i * 0.9) * r * 0.10;
        const x = cx + (r + noise) * Math.cos(angle);
        const y = cy + (r + noise) * Math.sin(angle);
        d += j === 0 ? `${x} ${y} ` : `L ${x} ${y} `;
      }
      d += 'Z';
      const baseOpacity = 0.15 + (i / layers) * 0.35;
      paths.push({ d, opacity: baseOpacity });
    }
    return paths;
  }

  let results = {};


  async function generateNarrative(results) {
    // 生成缓存 key（基于各测评结果的摘要）
    const cacheKey = 'narrative_' + JSON.stringify(
      Object.entries(results).map(([k, v]) => [k, v.summary, v.score]).sort()
    ).slice(0, 200);

    // 检查缓存
    const cached = localStorage.getItem(cacheKey);
    if (cached) return cached;

    try {
      const res = await fetch('/.netlify/functions/narrative', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ results })
      });
      if (!res.ok) throw new Error('API failed');
      const data = await res.json();
      const narrative = data.narrative;
      localStorage.setItem(cacheKey, narrative);
      return narrative;
    } catch (e) {
      return generateNarrativeFallback(results);
    }
  }

  function generateNarrativeFallback(results) {
    const parts = [];
    const cog = results['cognitive'] || results['cognitive-48'];
    const hsp = results['hsp'], ecr = results['ecr'];
    const fmps = results['fmps'], boundary = results['boundary-sense'];
    if (cog) parts.push(`你的认知类型是 ${cog.summary || '未知类型'}，内在价值坐标精密，对可能性高度敏感。`);
    if (hsp) parts.push(`HSP 得分 ${safeScore(hsp)}，${hsp.summary || ''}——你对情绪信号有极高的分辨率。`);
    if (ecr) parts.push(`依恋类型偏向${ecr.topDimension || '未知'}，${ecr.summary || ''}。`);
    if (fmps && boundary) parts.push(`完美主义倾向（${safeScore(fmps)}）与边界感（${safeScore(boundary)}）构成了一组张力：高标准与渗透性边界并存。`);
    if (parts.length === 0) return null;
    return parts.join('') + ' 这张地图在持续生长，每完成一个测评，它就会更接近真实的你。';
  }

  function renderMoodCalendar() {
    const grid = document.getElementById('moodGrid');

    try {
      const saved = JSON.parse(localStorage.getItem('sheIs_mood_today') || 'null');

        const today = new Date().toDateString();
        const savedDay = new Date(saved.timestamp).toDateString();

    const todayDate = new Date().getDate();
    for (let i = 1; i <= 30; i++) {

      daySpan.className = 'mood-day';

          </div>
          ${scoreNum !== null ? `<div style="height:2px;background:rgba(74,48,115,0.08);border-radius:1px;overflow:hidden;"><div style="height:100%;width:${scoreNum}%;background:rgba(74,48,115,0.3);border-radius:1px;transition:width 0.6s;"></div></div>` : ''}`;
        listDiv.appendChild(card);
      });
      wrap.appendChild(listDiv);
    }

    // Branding footer
    wrap.innerHTML += `
      <div style="text-align:center;padding-top:16px;border-top:1px solid rgba(74,48,115,0.08);">
        <div style="font-size:8px;letter-spacing:3px;color:rgba(74,48,115,0.3);font-family:'Noto Sans SC',sans-serif;">女也 She Is · Inner Landscape</div>
        <div style="font-size:7px;color:rgba(30,22,40,0.2);letter-spacing:2px;font-family:'Noto Sans SC',sans-serif;margin-top:4px;">she-is-app.netlify.app</div>
      </div>`;

    return wrap;
  }

  function buildCTA(regions) {
    const section = document.getElementById('ctaSection');
    const incomplete = regions.filter(r => !r.completed && r.id !== 'motivation');
    if (incomplete.length === 0) return;
    const next = incomplete[0];
    section.innerHTML = `
      <a class="cta-card" href="assessment.html">
        <div>
          <div class="cta-label">${next.label} · 待探索</div>
          <div class="cta-sub">${next.description} → 开始测评</div>
        </div>
        <span class="cta-arrow">›</span>
      </a>`;
  }

  function renderAxesCards(results) {
    const list = document.getElementById('axesList');
    if (!list) return;
    const axes = [
      { id: 'trait', name: '特质轴', nameEn: 'Trait Axis', desc: '你如何感知、思考、做决策——这是你最底层的操作系统', tests: [
        { id: 'cognitive', name: '荣格认知功能 · 完整版', nameEn: 'Jungian Cognitive Functions', scoreKey: 'summary', path: 'test-cognitive.html' },
        { id: 'cognitive-48', name: '荣格认知功能 · 48题版', nameEn: 'Cognitive Functions 48Q', scoreKey: 'summary', path: 'test-cognitive-48.html' },
      ]},
      { id: 'emotion', name: '情绪轴', nameEn: 'Emotion Axis', desc: '你如何感受、消化、应对情绪——这里藏着你消耗最多能量的地方', tests: [
        { id: 'hsp', name: '高敏感度特质测试', nameEn: 'High Sensitivity', scoreKey: 'score', path: 'test-hsp.html' },
        { id: 'erq', name: '情绪调节策略', nameEn: 'Emotion Regulation', scoreKey: 'score', path: 'test-erq.html' },
        { id: 'ecr', name: '成人依恋类型', nameEn: 'Attachment Style', scoreKey: 'topDimension', path: 'test-ecr.html' },
      ]},
      { id: 'behavior', name: '行为轴', nameEn: 'Behavior Axis', desc: '你如何行动、设标准、划边界——这决定了你和世界的互动方式', tests: [
        { id: 'fmps', name: '完美主义倾向量表', nameEn: 'Perfectionism', scoreKey: 'score', path: 'test-fmps.html' },
        { id: 'boundary-sense', name: '边界感评估', nameEn: 'Boundary Sense', scoreKey: 'score', path: 'test-boundary-sense.html' },
      ]},
      { id: 'motivation', name: '动机轴', nameEn: 'Motivation Axis', desc: '你为什么是这样的你——驱动力和恐惧的根源（即将上线）', tests: [
        { id: 'abm-love-animal', name: '爱情动物测评', nameEn: 'Love Animal', scoreKey: 'topDimension', path: 'test-abm-love-animal.html' },
      ]},
    ];
    axes.forEach(axis => {
      const completedTests = axis.tests.filter(t => results[t.id]);
      const isCompleted = completedTests.length > 0;
      const card = document.createElement('div');
      card.className = `axis-card${isCompleted ? ' completed' : ''}`;
      card.dataset.axisId = axis.id;
      const header = document.createElement('div');
      header.className = 'axis-card-header';
      const progress = axis.tests.length > 0 ? `${completedTests.length}/${axis.tests.length}` : '';
      const progressLabel = isCompleted ? `<span style="font-size:9px;color:var(--accent);opacity:0.6;font-family:'Noto Sans SC',sans-serif;letter-spacing:1px;margin-top:5px;display:block;">${progress} 已完成</span>` : `<span style="font-size:9px;color:var(--text-muted);font-family:'Noto Sans SC',sans-serif;letter-spacing:1px;margin-top:5px;display:block;">待探索</span>`;
      header.innerHTML = `
        <div class="axis-card-title">
          <div class="axis-card-name">${axis.name} <span class="axis-card-name-en">${axis.nameEn}</span></div>
          <div class="axis-card-desc">${axis.desc}</div>
          ${progressLabel}
        </div>
        <span class="material-symbols-outlined axis-card-chevron">expand_more</span>
      `;
      const body = document.createElement('div');
      body.className = 'axis-card-body';
      axis.tests.forEach(test => {
        const r = results[test.id];
        const item = document.createElement('div');
        item.className = 'test-item';
        let badge = '';
        let progressWidth = 0;
        if (r) {
          const rawVal = r[test.scoreKey];
          const val = rawVal && typeof rawVal === 'object' ? safeScore(r) : rawVal;
          badge = val ? String(val).substring(0, 8) : '已完成';
          progressWidth = typeof r.score === 'number' ? Math.min(100, r.score) : 70;
        }
        const testLink = test.path || '#';
        item.style.cursor = 'pointer';
        item.addEventListener('click', () => { window.location.href = testLink; });
        item.innerHTML = `
          <div class="test-item-header">
            <div>
              <div class="test-item-name">${test.name}</div>
              <div class="test-item-name-en">${test.nameEn}</div>
            </div>
            ${r ? `<span class="test-item-badge">${badge}</span>` : `<span class="test-item-badge pending">→ 开始</span>`}
          </div>
          ${r ? `<div class="progress-bar-bg"><div class="progress-bar" style="width:${progressWidth}%"></div></div>` : ''}
        `;
        body.appendChild(item);
      });
      header.addEventListener('click', () => { card.classList.toggle('open'); });
      card.appendChild(header);
      card.appendChild(body);
      list.appendChild(card);
    });
  }

  function init() {
    results = loadResults();
    const regions = buildRegions(results);
    setTimeout(() => {
      document.getElementById('header').classList.add('visible');
    }, 100);
    const completedCount = regions.filter(r => r.completed).length;
    renderMap(regions);
    renderMoodCalendar();
    initMoodPicker();
    // Show narrative section with placeholder, then fill async
    const ns = document.getElementById('narrativeSection');
    const narrativeTextEl = document.getElementById('narrativeText');
    narrativeTextEl.textContent = '解读生成中…';
    ns.style.display = 'block';
    setTimeout(() => ns.classList.add('visible'), 2000);
    generateNarrative(results).then(narrative => {
      narrativeTextEl.textContent = narrative || '完成更多测评，解读将在这里生长。';
      if (!narrative) ns.style.display = 'none';
    });
    renderAxesCards(results);
    buildShareCard(results);
    window._mapRegions = regions;
    window._mapResults = results;
  }

  function initMoodPicker() {
    const grid = document.getElementById('moodOptionsGrid');
    const recorded = document.getElementById('moodRecorded');
    if (!grid) return;
    // Restore saved state
    try {
      const saved = JSON.parse(localStorage.getItem('sheIs_mood_today') || 'null');
      if (saved && saved.timestamp) {
        const today = new Date().toDateString();
        const savedDay = new Date(saved.timestamp).toDateString();
        if (today === savedDay && saved.mood) {
          const btn = grid.querySelector(`[data-mood="${saved.mood}"]`);
          if (btn) btn.classList.add('selected');
          if (recorded) recorded.style.display = 'block';
        }
      }
    } catch(e) {}
    // Click handlers
    grid.querySelectorAll('.mood-capsule').forEach(btn => {
      btn.addEventListener('click', function() {
        grid.querySelectorAll('.mood-capsule').forEach(b => b.classList.remove('selected'));
        this.classList.add('selected');
        const mood = this.dataset.mood;
        const color = this.dataset.color;
        localStorage.setItem('sheIs_mood_today', JSON.stringify({ mood, color, timestamp: Date.now() }));
        if (recorded) recorded.style.display = 'block';
        // Refresh calendar dot
        const moodGrid = document.getElementById('moodGrid');
        if (moodGrid) {
          moodGrid.innerHTML = '';
          renderMoodCalendar();
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    init();
    document.getElementById('shareModal').addEventListener('click', function(e) {
      if (e.target === this) closeShareModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('shareModal');
        if (modal && modal.style.display !== 'none') closeShareModal();
      }
    });
  });
</script>
<script>
  (async () => {
    if (typeof getUser !== 'function') return;
    const user = await getUser();
    const loginBtn  = document.getElementById('loginEntryBtn');
    const avatarCircle = document.getElementById('avatarCircle');
    if (!loginBtn) return;
    if (user) {
      const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email?.split('@')[0] || '我';
      if (avatarCircle) {
        avatarCircle.innerHTML = '<span class="text-xs font-bold text-white">' + name.charAt(0).toUpperCase() + '</span>';
        avatarCircle.style.background = 'linear-gradient(135deg,#4a3073,#9c3c62)';
        avatarCircle.classList.remove('hidden');
      }
    } else {
      loginBtn.classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
